<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="rupeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Inner Glass Border Highlight -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#glowGrad)" stroke-width="6"/>

  <!-- House Silhouette -->
  <g filter="url(#shadow)">
    <!-- House Roof -->
    <path d="M120 250 L256 128 L392 250" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Chimney -->
    <path d="M334 190 V148 H366 V218" fill="#FFFFFF" fill-opacity="0.9" stroke="none"/>
    <!-- House Walls -->
    <path d="M152 240 V380 C152 396 164 408 180 408 H332 C348 408 360 396 360 380 V240" fill="rgba(15, 23, 42, 0.45)" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Doorway Arc -->
    <path d="M220 408 V320 C220 300 236 288 256 288 C276 288 292 300 292 320 V408" fill="#4F46E5" fill-opacity="0.8"/>
  </g>

  <!-- Currency Rupee Badge (Kiraya) -->
  <g transform="translate(196, 204)">
    <circle cx="60" cy="60" r="48" fill="url(#rupeeGrad)" filter="url(#shadow)"/>
    <!-- Rupee Symbol -->
    <text x="60" y="76" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" text-anchor="middle">₹</text>
  </g>

  <!-- Electricity Lightning Bolt Badge (Bijli Bill) -->
  <g transform="translate(328, 298)">
    <circle cx="48" cy="48" r="44" fill="#0F172A" stroke="#F59E0B" stroke-width="6" filter="url(#shadow)"/>
    <path d="M50 20 L30 52 H46 L42 76 L66 44 H50 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
  </g>
</svg>
