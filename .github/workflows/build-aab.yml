name: Generate Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | ${ANDROID_HOME}/tools/bin/sdkmanager --licenses || true

      - name: Install Cordova and Build Signed AAB
        run: |
          sudo npm install -g cordova
          cordova create myapp com.nivaskirayabook.app "Nivas KirayaBook"
          cd myapp
          cordova platform add android

          # Copy App Icon and Config
          mkdir -p res
          if [ -f "../icon-512.png" ]; then
            cp ../icon-512.png res/icon.png
          fi
          if [ -f "../build-config.xml" ]; then
            cp ../build-config.xml config.xml
          fi

          # Build Release AAB
          cordova build android --release -- --bundle

          # Generate Keystore and Sign the AAB for Google Play Store
          keytool -genkey -v -keystore nivas-release.keystore -alias nivas_key -keyalg RSA -keysize 2048 -validity 10000 -storepass nivas2026 -keypass nivas2026 -dname "CN=Nivas KirayaBook, OU=App, O=Nivas, L=Mumbai, ST=Maharashtra, C=IN"

          # Find generated AAB and sign it
          AAB_PATH=$(find platforms/android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          echo "Found AAB at: $AAB_PATH"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore nivas-release.keystore -storepass nivas2026 -keypass nivas2026 "$AAB_PATH" nivas_key

          # Copy to output directory
          mkdir -p ../dist
          cp "$AAB_PATH" ../dist/nivas-kirayabook-signed.aab
          cp nivas-release.keystore ../dist/nivas-release.keystore

      - name: Upload Signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nivas-KirayaBook-Signed-AAB
          path: dist/nivas-kirayabook-signed.aab

      - name: Upload Release Keystore (Save this file safely!)
        uses: actions/upload-artifact@v4
        with:
          name: Nivas-Release-Keystore-Backup
          path: dist/nivas-release.keystore
